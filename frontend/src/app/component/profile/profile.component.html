<div [class]="(horizontal() ? 'row' : 'column') + ' ' + (large() ? 'gap' : 'gap-small') + ' center profile'">
	<p-avatar [size]="large() ? 'xlarge' : 'normal'" [icon]="emoji() === undefined ? 'pi pi-user' : undefined" [label]="emoji()" shape="circle"/>
	@if (showName()) {
		<div>{{ getName() }}</div>
	}
</div>
