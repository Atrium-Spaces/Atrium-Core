<div *transloco="let t" class="row">
	<div class="spacing"></div>
	<p-button [icon]="getThemeIcon()" (onClick)="toggleTheme()" rounded text severity="secondary" [pTooltip]="t(getThemeTranslationKey())" tooltipPosition="left"/>
	<p-button icon="pi pi-language" (onClick)="menu.toggle($event)" rounded text severity="secondary" [pTooltip]="t('header.language')" tooltipPosition="left"/>
	<p-menu #menu [model]="languageMenuItems" [popup]="true"/>
</div>
